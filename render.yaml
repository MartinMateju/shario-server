# Unapplied plan: creates five paid Node services + private paid Redis (~$45/month).
# No provider credentials are included. Read docs/RENDER.md before applying.
# Provider inputs are prompted once on shario-api and referenced by its workers.
# Generated application secrets belong only to this new Shario environment.
# Confirm all shario-* resource names are unused; existing names can be updated.
# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
previews:
  generation: 'off'
services:
- type: web
  name: shario-api
  runtime: node
  repo: https://github.com/MartinMateju/shario-server
  branch: main
  region: frankfurt
  plan: 0.5c-512mb
  numInstances: 1
  buildCommand: npm ci --include=dev --no-audit --no-fund && npm run build && npm prune --omit=dev --no-audit --no-fund
  startCommand: node dist/server.js
  autoDeployTrigger: checksPass
  maxShutdownDelaySeconds: 60
  healthCheckPath: /ready
  envVars:
  - fromGroup: shario-production-runtime
  - key: REDIS_URL
    fromService:
      type: keyvalue
      name: shario-redis
      property: connectionString
  - key: SERVER_URL
    sync: false
  - key: CLIENT_URL
    sync: false
  - key: MONGO_URI
    sync: false
  - key: AUTH_EMAIL
    sync: false
  - key: EMAIL_USER
    sync: false
  - key: EMAIL_PASSWORD
    sync: false
  - key: EMAIL_HOST
    sync: false
  - key: EMAIL_PORT
    sync: false
  - key: EMAIL_SECURE
    sync: false
  - key: STRIPE_KEY
    sync: false
  - key: STRIPE_TENANT_BILLING_MODE
    sync: false
  - key: WEBHOOK_SECRET
    sync: false
  - key: STRIPE_CONNECT_WEBHOOK_SECRET
    sync: false
  - key: STRIPE_BILLING_WEBHOOK_SECRET
    sync: false
  - key: POSTMARK_ACCOUNT_TOKEN
    sync: false
  - key: POSTMARK_SYSTEM_SERVER_TOKEN
    sync: false
  - key: POSTMARK_SYSTEM_FROM_EMAIL
    sync: false
  - key: POSTMARK_OUTBOUND_WEBHOOK_URL
    sync: false
  - key: R2_ACCOUNT_ID
    sync: false
  - key: R2_ACCESS_KEY_ID
    sync: false
  - key: R2_SECRET_ACCESS_KEY
    sync: false
  - key: R2_BUCKET
    sync: false
  - key: R2_PUBLIC_URL
    sync: false
