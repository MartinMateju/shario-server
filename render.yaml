- type: keyvalue
  name: shario-redis
  region: frankfurt
  plan: 256mb
  ipAllowList: []
  maxmemoryPolicy: noeviction
  persistenceMode: journal-snapshot
envVarGroups:
- name: shario-production-runtime
  envVars:
  - key: NODE_VERSION
    value: '22'
  - key: NODE_ENV
    value: production
  - key: LOG_LEVEL
    value: info
  - key: COMMUNICATION_SCHEDULER_INTERVAL_MS
    value: '60000'
  - key: SHUTDOWN_DRAIN_TIMEOUT_MS
    value: '30000'
  - key: SHUTDOWN_CLEANUP_TIMEOUT_MS
    value: '20000'
  - key: NATIVE_INVOICES_ENABLED
    value: 'false'
  - key: DATA_IMPORT_COMMERCE_ENABLED
    value: 'false'
  - key: LEGACY_PLATFORM_CHECKOUT_WEBHOOK_ENABLED
    value: 'false'
  - key: TENANT_BILLING_EMAILS_ENABLED
    value: 'true'
  - key: EMAIL_ALLOW_SELF_SIGNED
    value: 'false'
  - key: EMAIL_FROM_NAME
    value: Shario
  - key: POSTMARK_FROM_DOMAIN
    value: notify.shario.io
  - key: POSTMARK_SYSTEM_FROM_NAME
    value: Shario
  - key: POSTMARK_TENANT_SERVER_PREFIX
    value: shario-production
  - key: POSTMARK_MESSAGE_STREAM
    value: outbound
  - key: ACCESS_TOKEN_SECRET
    generateValue: true
  - key: REFRESH_TOKEN_SECRET
    generateValue: true
  - key: WAITLIST_TOKEN_PEPPER
    generateValue: true
  - key: BOOKING_INTENT_SECRET
    generateValue: true
  - key: EMAIL_SECRET_KEY
    generateValue: true
  - key: COMMUNICATION_SECRET_KEY
    generateValue: true
  - key: ACCESS_CODE_ENCRYPTION_KEY
    generateValue: true
  - key: POSTMARK_OUTBOUND_WEBHOOK_USERNAME
    generateValue: true
  - key: POSTMARK_OUTBOUND_WEBHOOK_PASSWORD
    generateValue: true
