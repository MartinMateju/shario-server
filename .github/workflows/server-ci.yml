name: Server CI

on:
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Build and critical tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
      NODE_ENV: test
      TZ: UTC
      RUN_MONGO_INTEGRATION_TESTS: "true"
      MONGOMS_DOWNLOAD_DIR: ${{ github.workspace }}/.cache/mongodb-binaries
      OPENAI_API_KEY: ""
      TEST_REDIS_SERVER: /usr/bin/redis-server

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Restore MongoDB binary cache
        uses: actions/cache@v6
        with:
          path: .cache/mongodb-binaries
          key: ${{ runner.os }}-mongodb-memory-${{ hashFiles('package-lock.json') }}

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Install disposable scheduler test Redis
        run: sudo apt-get update && sudo apt-get install -y redis-server

      - name: Run production-critical tests
        run: npm run test:critical


      - name: Build production server
        run: npm run build
